seed: 23

type: train_nerf
output: my_highres

training:
  num_epochs: 250
  batch_size: 1024
  lr: 0.0001

  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.8

  checkpoint_path: ./checkpoints
  checkpoint_interval: 50
  resume: True

  render_interval: 10

data:
  image_size: [400, 400]
  dataset_name: materials

renderer:
  type: volume
  chunk_size: 32768
  white_background: False

sampler:
  type: stratified
  n_pts_per_ray: 128
  min_depth: 1.0
  max_depth: 7.0

implicit_function:
  type: nerf

  # Position encoding parameters (γ(x) in paper)
  n_harmonic_functions_xyz: 6  # L=10 for position in paper
  n_harmonic_functions_dir: 2  # L=4 for view direction in paper

  # Network architecture parameters
  n_hidden_neurons_xyz: 128     # 8 layers of 256 neurons for spatial network
  n_hidden_neurons_dir: 64     # 128 neurons for view-dependent network
  n_layers_xyz: 6            # 8 layers total for spatial network
  append_xyz: [3]              # Skip connection at 5th layer (index 4)
  
  # View direction settings
  use_view_dirs: True          # Enable view direction input to color network
  use_input: False             # Use input in view direction positional embedding
  # Training parameters
  density_noise_std: 0.0       # Add noise during training as mentioned in paper 